{% set version = "0.3.5" %}

package:
  name: particula
  version: {{ version }}

source:
  url: https://github.com/uncscode/particula/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 969d7b7979fcb1b38986dd00ed60ba6dedbac25b9bc8971e76dd7d841042d6b2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3.12,<4
  run:
    - python >={{ python_min }}
    - numpy >=2.0.0
    - scipy >=1.14.0
    - typing_extensions >=4.0.0
    - warp-lang
    - pyyaml

test:
  requires:
    - python {{ python_min }}
    - pytest
    - pip
  source_files:
    - particula
    - pyproject.toml
    - conftest.py
    - scripts/run_release_tests.py
    - docs/studies/examples/particle-processes/sources-and-dilution/cpu_dilution.py
    - docs/studies/examples/particle-processes/sources-and-dilution/cpu_nucleation.py
    - docs/studies/examples/particle-processes/condensation/condensation_latent_heat.py
    - examples_tests/dilution_example_test.py
    - examples_tests/nucleation_example_test.py
    - examples_tests/condensation_latent_heat_example_test.py
  commands:
    - python scripts/run_release_tests.py --installed
    - python scripts/run_release_tests.py --installed --suite examples

about:
  home: https://uncscode.github.io/particula
  license: MIT
  license_family: MIT
  license_file: license
  summary: a simple, fast, and powerful particle simulator
  description: |
    Particula is a Python-based aerosol particle simulator. Its goal is to
    provide a robust aerosol simulation (including both gas and particle phases)
    that can be used to answer scientific questions arising from experiments and research endeavors.
  dev_url: https://github.com/uncscode/particula
  doc_url: https://uncscode.github.io/particula/

extra:
  recipe-maintainers:
    - gorkowski
    - ngam
    - mahf708
